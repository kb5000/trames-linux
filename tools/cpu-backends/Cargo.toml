[package]
name = "trames-cpu-backends"
version = "0.1.0"
edition = "2021"
rust-version = "1.101"
license = "GPL-3.0-or-later"

# An isolated measurement package; it adds no product/iPad JIT dependency.
[workspace]

[dependencies]
trames-kvm = { path = "../../crates/trames-kvm" }
trames-engine = { path = "../../runtime/crates/trames-engine" }
trames-execution = { path = "../../runtime/crates/trames-execution" }
trames-memory = { path = "../../runtime/crates/trames-memory" }
trames-interpreter = { path = "../../runtime/crates/trames-interpreter" }
trames-jit = { path = "../../runtime/crates/trames-jit", features = ["native-aarch64"] }
serde_json = "=1.0.151"

[profile.release]
overflow-checks = true
lto = "thin"
