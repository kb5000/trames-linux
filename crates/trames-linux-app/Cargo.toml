[package]
name = "trames-linux-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trames"
path = "src/main.rs"

[dependencies]
trames-cli-common.workspace = true
trames-kvm = { path = "../trames-kvm" }
serde_json.workspace = true
trames-session.workspace = true
trames-distro.workspace = true
trames-linux-abi.workspace = true
trames-vfs.workspace = true
trames-wayland.workspace = true
trames-shared.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false, features = ["dl-libxcb", "xfixes", "xkb", "present", "dri3"] }

xim = {version="=0.5.0",default-features=false,features=["x11rb-client","x11rb-xcb"]}
wayland-client = {version="=0.31.14",features=["system","dlopen"]}
wayland-protocols = {version="=0.32.13",features=["client","unstable","staging"]}
ash = "=0.38.0"
trames-graphics.workspace = true
libc.workspace = true

[dev-dependencies]
libc.workspace = true
trames-vulkan.workspace = true
trames-memory.workspace = true
libloading = "=0.8.9"

[lints]
workspace = true
