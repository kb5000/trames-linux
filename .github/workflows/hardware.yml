name: Required KVM hardware checks
on:
  workflow_dispatch:
    inputs:
      vulkan_host_import:
        description: Also require host Vulkan external_memory_host interop
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  arm64-kvm:
    runs-on: [self-hosted, Linux, ARM64, trames-kvm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev
      - run: python3 runtime/scripts/build-guest-cli.py
      - run: cargo build --workspace --release --locked
      - run: cargo test -p trames-kvm --lib --test hardware --locked -- --ignored --test-threads=1
      - run: TRAMES_KVM_TRANSPORT=mmio cargo test -p trames-kvm --lib --test hardware --locked -- --ignored --test-threads=1
      - if: inputs.vulkan_host_import
        run: cargo test -p trames-kvm --test vulkan --locked -- --ignored --test-threads=1
      - if: inputs.vulkan_host_import
        run: TRAMES_KVM_TRANSPORT=mmio cargo test -p trames-kvm --test vulkan --locked -- --ignored --test-threads=1
      - run: bash scripts/validate-hardware.sh
      - run: python3 scripts/validate-session.py
      - run: TRAMES_KVM_TRANSPORT=mmio TRAMES_VALIDATION_OUTPUT=target/validation/session-mmio python3 scripts/validate-session.py
      - run: TRAMES_VALIDATION_OUTPUT=target/validation/cli python3 scripts/validate-cli.py
      - run: TRAMES_KVM_TRANSPORT=mmio TRAMES_VALIDATION_OUTPUT=target/validation/cli-mmio python3 scripts/validate-cli.py
      - run: python3 scripts/validate-file-jit.py
      - run: python3 scripts/validate-process-resources.py
      - run: python3 scripts/validate-audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-hardware-results
          path: target/validation/
          if-no-files-found: error
