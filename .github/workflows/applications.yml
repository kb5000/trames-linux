name: Required KVM application acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  applications:
    runs-on: [self-hosted, Linux, ARM64, trames-kvm]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - run: sudo apt-get update -qq && sudo apt-get install -y build-essential python3 git curl openssh-client nodejs gzip bzip2 xz-utils
      - name: Build with source and binary receipt
        run: python3 runtime/tests/acceptance/build.py --product . --runtime runtime --binary target/release/trames --receipt target/acceptance-build.json -- cargo build --workspace --release --locked
      - run: python3 runtime/tests/acceptance/prepare.py --output target/acceptance-bundle
      - run: tar --format=pax --xattrs --xattrs-include='*' --acls --numeric-owner -czf target/acceptance-bundle.tar.gz -C target acceptance-bundle
      - name: Native reference and real KVM software matrix
        run: python3 scripts/validate-applications.py --bundle target/acceptance-bundle --runner target/release/trames --receipt target/acceptance-build.json --output target/acceptance-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-application-evidence
          path: |
            target/acceptance-matrix/
            target/acceptance-bundle/bundle.json
            target/acceptance-build.json
            target/acceptance-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14
